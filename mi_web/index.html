<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscador Nissan Tsuru</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="#versiones" class="nav-link">Versiones</a>
                <a href="#galeria" class="nav-link">Galería</a>
                <a href="#comunidad" class="nav-apps" title="Comunidad Tsuru">
                    <img src="images/apps-icon.png" alt="Ícono comunidad Tsuru">
                </a>
                <a href="#acceso" class="nav-login">Club Tsuru</a>
            </nav>
        </header>

        <main>
            <section class="logo">
                <img src="images/tsuru-logo.png" alt="Logo Nissan Tsuru" width="300">
            </section>

            <section class="buscador-bar">
                <label class="label-buscador" for="buscar">
                    <img src="images/search-icon.png" alt="Ícono de buscar" width="25" class="icon-buscar">
                    <input type="text" id="buscar" name="buscar" placeholder="Buscar modelos, motor GA16DE o refacciones del Tsuru">
                    <div class="acciones-buscador">
                        <a href="#voz-tsuru" title="Buscar por voz">
                            <img src="images/mic-icon.png" alt="Ícono de micrófono" width="25">
                        </a>
                        <a href="#camara-tsuru" title="Buscar por imagen">
                            <img src="images/camera-icon.png" alt="Ícono de cámara" width="25">
                        </a>
                    </div>
                </label>
            </section>

            <section class="botones">
                <button type="button">Buscar Tsuru</button>
                <button type="button">Edición Especial</button>
                <p>
                    Fichas técnicas disponibles en:
                    <a href="#v16">Tsuru V16</a>
                    <a href="#gsr">Tsuru GSR 2000</a>
                </p>
            </section>
        </main>

        <footer>
            <div class="pais">México</div>
            <div class="footer-links">
                <ul>
                    <li><a href="#historia">Sobre Tsuru</a></li>
                    <li><a href="#mantenimiento">Mantenimiento</a></li>
                    <li><a href="#refacciones">Refacciones</a></li>
                    <li><a href="#motor">Motor GA16DE</a></li>
                </ul>
                <ul>
                    <li><a href="#privacidad">Privacidad</a></li>
                    <li><a href="#condiciones">Condiciones</a></li>
                    <li><a href="#preferencias">Preferencias</a></li>
                </ul>
            </div>
        </footer>
    </body>
</html>
